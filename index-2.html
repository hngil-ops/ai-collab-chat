<title>AI들이 일을 이어 가고 있어요 · 5종 AI 협업 채팅방</title>
<style>
/* ============================================================
   0. 기본 설정
   ============================================================ */
:root{
  --ink:#141a24;
  --ink2:#5a6474;
  --ink3:#8b95a5;
  --line:#e3e8f2;
  --brand:#2f6bff;
  --brand2:#5b46ff;
  --card:#ffffff;
  --bg:#f4f7fc;
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 8% -12%, #dfe8ff 0%, rgba(223,232,255,0) 62%),
    radial-gradient(760px 520px at 108% 6%, #ffe4ef 0%, rgba(255,228,239,0) 58%),
    #eaeef6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  line-height:1.5;
}
button{font-family:inherit}

/* ============================================================
   1. 앱 프레임
   ============================================================ */
.app{
  position:relative;
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  max-width:560px;
  margin:0 auto;
  background:var(--bg);
  overflow:hidden;
}
@media (min-width:640px){
  body{padding:20px}
  .app{height:calc(100dvh - 40px);max-height:940px;border-radius:26px;
    box-shadow:0 30px 70px -28px rgba(18,28,56,.42), 0 2px 10px rgba(18,28,56,.07);
    border:1px solid rgba(255,255,255,.8)}
}

/* ============================================================
   2. 헤더
   ============================================================ */
.top{
  position:relative;
  flex:0 0 auto;
  padding:15px 16px 0;
  color:#fff;
  background:
    radial-gradient(115% 130% at 100% 0%, #3c4fa8 0%, rgba(60,79,168,0) 56%),
    radial-gradient(90% 120% at 0% 100%, #1c3f6b 0%, rgba(28,63,107,0) 60%),
    linear-gradient(135deg,#101a2e 0%, #182545 55%, #202f5e 100%);
}
.top::after{
  content:"";position:absolute;inset:auto 0 0 0;height:1px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.18),rgba(255,255,255,0));
}
.top-row{display:flex;align-items:center;gap:10px;min-height:34px}
.avatars{display:flex;align-items:center;flex:0 0 auto;padding-left:2px}
.avatars .av{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:16px;background:var(--soft);border:2px solid rgba(16,26,46,.95);
  box-shadow:0 0 0 2px rgba(255,255,255,.14);
  margin-left:-11px;position:relative;
}
.avatars .av:first-child{margin-left:0}
.avatars .av span{line-height:1;transform:translateY(.5px)}
.hbadge{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;letter-spacing:-.2px;
  color:#dbe6ff;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.16);
  padding:6px 10px;border-radius:999px;white-space:nowrap;
}
.hbadge .dot{width:6px;height:6px;border-radius:50%;background:#43e08d;box-shadow:0 0 0 3px rgba(67,224,141,.18)}
h1{
  margin:11px 0 3px;font-size:19px;line-height:1.35;font-weight:800;
  letter-spacing:-.6px;
}
.top-status{
  margin:0 0 12px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.58);
  letter-spacing:-.1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:17px;
}
.top-status .sep{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.35)}
.top-status b{color:#9fc1ff;font-weight:700}

/* 탭 */
.tabs{display:flex;position:relative;border-top:1px solid rgba(255,255,255,.09)}
.tab{
  flex:1;appearance:none;background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.6);font-size:13.5px;font-weight:700;letter-spacing:-.2px;
  padding:11px 0 14px;position:relative;transition:color .18s ease;
}
.tab:active{opacity:.7}
.tab.active{color:#fff}
.tab.active::after{
  content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:24px;height:3px;border-radius:3px;background:#fff;
}

/* ============================================================
   3. 패널 / 스레드
   ============================================================ */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.panel[hidden]{display:none !important}

.toolbar{
  flex:0 0 auto;display:flex;gap:6px;align-items:center;
  padding:9px 14px;background:rgba(244,247,252,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{display:none}
.fchip{
  appearance:none;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:12.5px;font-weight:700;letter-spacing:-.2px;
  padding:6px 11px;border-radius:999px;transition:.16s ease;
}
.fchip.on{background:#121c33;border-color:#121c33;color:#fff}
.fchip .n{opacity:.6;margin-left:3px;font-weight:600}
.toolbar .spacer{margin-left:auto}
.mini-link{
  appearance:none;border:0;background:none;color:var(--ink3);cursor:pointer;
  font-size:11.5px;font-weight:700;white-space:nowrap;padding:4px 2px;
}

.thread{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:14px 14px 10px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
.thread::-webkit-scrollbar{width:6px}
.thread::-webkit-scrollbar-thumb{background:#d5dde9;border-radius:6px}

.day{display:flex;justify-content:center;margin:6px 0 14px}
.day span{
  font-size:11.5px;font-weight:700;color:#7c8799;letter-spacing:-.2px;
  background:#e6ecf6;padding:5px 12px;border-radius:999px;
}

.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:15px}
.row.user{justify-content:flex-end}
.row .av{
  flex:0 0 32px;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
  font-size:15px;background:var(--soft,#eef2f9);border:1px solid rgba(16,26,46,.05);
  margin-top:1px;
}
.row .av span{line-height:1}
.row .col{display:flex;flex-direction:column;min-width:0;max-width:calc(100% - 44px)}
.row.user .col{align-items:flex-end;max-width:84%}

.who{display:flex;align-items:center;gap:5px;margin:0 0 4px 2px}
.who .nm{font-size:12px;font-weight:800;color:var(--c,#37425a);letter-spacing:-.2px}
.who .role{
  font-size:9.5px;font-weight:800;letter-spacing:-.1px;
  color:var(--c,#5a6474);background:var(--soft,#eef2f9);
  padding:1px 5px;border-radius:5px;
}

.bubble{
  position:relative;
  background:#fff;border:1px solid #e6ecf6;
  border-radius:4px 16px 16px 16px;
  padding:10px 13px;
  font-size:14.5px;line-height:1.68;letter-spacing:-.15px;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  box-shadow:0 1px 2px rgba(16,24,40,.045);
}
.row.user .bubble{
  background:linear-gradient(135deg,#2f6bff 0%,#4f57ff 100%);
  border:0;color:#fff;
  border-radius:16px 4px 16px 16px;
  box-shadow:0 8px 18px -10px rgba(47,107,255,.85);
}
.bubble strong{font-weight:800}
.bubble .mention{
  color:var(--mc,#2f6bff);font-weight:800;
  background:rgba(47,107,255,.085);border-radius:5px;padding:0 3px;
}
.row.user .bubble .mention{color:#fff;background:rgba(255,255,255,.22)}

.doneflag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;font-weight:800;letter-spacing:-.1px;
  margin-left:6px;padding:1px 6px;border-radius:6px;vertical-align:1px;
  color:#0f8f5c;background:#e6f7ef;
}
.row.user .doneflag{color:#0b3d2a;background:rgba(255,255,255,.85)}

.meta{display:flex;align-items:center;gap:9px;margin:5px 2px 0;font-size:11px;color:#9aa4b6}
.meta .dec{
  font-size:10px;font-weight:800;color:#8a5a00;background:#fff3d6;
  padding:1px 6px;border-radius:6px;letter-spacing:-.1px;
}
.meta button{
  appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;
  font-size:11px;font-weight:700;color:#8c96a9;padding:2px 0;
  display:inline-flex;align-items:center;gap:3px;
}
.meta button:hover{color:var(--brand)}
.meta button.on{color:#0f8f5c}
.row.done .bubble{opacity:.58;filter:saturate(.65)}

.sysline{
  margin:2px auto 14px;max-width:92%;text-align:center;
  font-size:11.5px;font-weight:600;color:#7c8799;line-height:1.55;
  background:#eaeff8;border-radius:12px;padding:7px 12px;
}

/* 타이핑 */
.typing .bubble{display:inline-flex;align-items:center;gap:4px;padding:11px 13px}
.tlabel{font-size:12px;font-weight:700;color:#8b95a5;margin-right:3px;letter-spacing:-.2px}
.tdot{width:5px;height:5px;border-radius:50%;background:#b7c1d3;animation:tdot 1.1s infinite ease-in-out}
.tdot:nth-child(3){animation-delay:.16s}
.tdot:nth-child(4){animation-delay:.32s}
@keyframes tdot{0%,70%,100%{opacity:.28;transform:translateY(0)}35%{opacity:1;transform:translateY(-2.5px)}}

/* 빈 상태 */
.empty{padding:26px 6px 20px;text-align:center}
.thread > .empty:only-child{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
.empty .ee{font-size:34px;line-height:1;margin-bottom:12px}
.empty h3{margin:0 0 6px;font-size:15px;font-weight:800;letter-spacing:-.4px}
.empty p{margin:0 0 16px;font-size:12.5px;color:var(--ink3);line-height:1.65}
.empty.small{padding:40px 8px}
.empty .tips{display:flex;flex-direction:column;gap:8px;align-items:stretch;margin:0 auto;max-width:330px}
.empty .tip{
  appearance:none;cursor:pointer;font-family:inherit;text-align:left;
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:#33405a;
  background:#fff;border:1px solid #dde5f2;border-radius:13px;
  padding:11px 13px;letter-spacing:-.25px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.empty .tip:active{transform:scale(.99)}
.empty .tip .arrow{margin-left:auto;color:#9fb0cc;font-weight:800;font-size:12px}
.empty .hint2{margin:14px 0 0;font-size:11.5px;color:#a2acbd}

/* 새 메시지 버튼 */
.jump{
  position:absolute;left:50%;bottom:calc(126px + var(--safe-b));transform:translate(-50%,6px);
  appearance:none;border:0;cursor:pointer;
  background:#121c33;color:#fff;font-size:11.5px;font-weight:700;
  padding:7px 13px;border-radius:999px;
  box-shadow:0 8px 20px -8px rgba(18,28,51,.7);
  opacity:0;pointer-events:none;transition:.2s ease;z-index:6;
}
.jump.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}

/* ============================================================
   4. 입력 카드
   ============================================================ */
.composer{
  flex:0 0 auto;position:relative;
  padding:8px 12px calc(10px + var(--safe-b));
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.composer .ch{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:800;color:#8b95a5;letter-spacing:-.2px;
  padding:1px 3px 6px;
}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px 8px;scrollbar-width:none}
.chip{
  appearance:none;cursor:pointer;flex:0 0 auto;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  border:1px solid #e2e8f3;background:#f7f9fd;color:#54607a;
  font-size:11.5px;font-weight:700;letter-spacing:-.2px;
  padding:5px 9px;border-radius:999px;transition:.15s ease;
}
.chip .cd{width:6px;height:6px;border-radius:50%;background:var(--c,#9aa4b6);flex:0 0 6px}
.chip.on{background:var(--c,#121c33);border-color:var(--c,#121c33);color:#fff}
.chip.on .cd{background:rgba(255,255,255,.9)}
.chip.all{--c:#121c33}

.inputrow{
  display:flex;align-items:flex-end;gap:8px;
  background:#f3f6fb;border:1px solid #e2e8f3;border-radius:20px;
  padding:5px 5px 5px 14px;transition:.16s ease;
}
.inputrow.focus{background:#fff;border-color:#b9ccff;box-shadow:0 0 0 4px rgba(47,107,255,.09)}
#input{
  flex:1 1 auto;min-width:0;border:0;background:none;outline:none;resize:none;
  font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  padding:8px 0;max-height:108px;letter-spacing:-.2px;
}
#input::placeholder{color:#a7b1c2;font-size:14.5px}
#sendBtn{
  flex:0 0 auto;appearance:none;border:0;cursor:pointer;
  background:linear-gradient(135deg,#2f6bff,#5b46ff);color:#fff;
  font-size:13.5px;font-weight:800;letter-spacing:-.3px;
  padding:11px 15px;border-radius:15px;
  box-shadow:0 8px 18px -9px rgba(47,107,255,.9);
  transition:.16s ease;white-space:nowrap;
}
#sendBtn:active{transform:scale(.97)}
#sendBtn:disabled{opacity:.42;box-shadow:none;cursor:default;transform:none}
.hint{display:flex;align-items:center;gap:6px;margin:7px 4px 0;font-size:10.5px;color:#a2acbd;font-weight:600}
.hint .mode{margin-left:auto;display:inline-flex;align-items:center;gap:4px}
.hint .mode i{width:5px;height:5px;border-radius:50%;background:#c2cbdb;font-style:normal}
.hint .mode.live{color:#0f8f5c}
.hint .mode.live i{background:#15b374}

/* ============================================================
   5. 멤버·AI 탭
   ============================================================ */
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 14px 20px}
.scroller::-webkit-scrollbar{width:6px}
.scroller::-webkit-scrollbar-thumb{background:#d5dde9;border-radius:6px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
}
.card-top{display:flex;align-items:center;gap:11px}
.big-av{
  flex:0 0 44px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-size:22px;background:var(--soft);border:1px solid rgba(16,26,46,.04);
}
.who2 .nm{font-size:15px;font-weight:800;letter-spacing:-.4px}
.who2 .rl{font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:1px;letter-spacing:-.2px}
.st{
  margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:-.2px;
}
.st .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.st.idle{background:#f0f3f9;color:#7d8798}
.st.working{background:#e4f7ee;color:#0f9d63}
.st.working .d{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

.tasks{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 9px}
.task{font-size:11.5px;font-weight:600;background:#f4f7fc;color:#4d586b;padding:4px 8px;border-radius:8px;letter-spacing:-.2px}
.quote{
  display:block;font-size:12.5px;color:#7d8798;background:#f8fafd;
  border:1px solid #eef2f9;border-radius:11px;padding:8px 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;
}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.stat{font-size:11px;font-weight:700;color:#95a0b2;letter-spacing:-.2px}
.btn{
  appearance:none;cursor:pointer;font-family:inherit;
  border:1px solid var(--line);background:#fff;color:#3b4658;
  font-size:12.5px;font-weight:800;letter-spacing:-.2px;
  padding:9px 12px;border-radius:11px;transition:.15s ease;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:#121c33;border-color:#121c33;color:#fff}
.btn.soft{background:#f4f7fc;border-color:#e4eaf5;color:#3b4658}
.btn.danger{background:#fdf4f2;border-color:#f2d8d3;color:#c0392b}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.talk{background:var(--c,#121c33);border-color:var(--c,#121c33);color:#fff}

/* ============================================================
   6. 설정 탭
   ============================================================ */
.sec h2{display:flex;align-items:center;gap:6px;margin:0 0 5px;font-size:13px;font-weight:800;letter-spacing:-.3px}
.sec .note{margin:0 0 11px;font-size:12px;color:#7d8798;line-height:1.6;letter-spacing:-.15px}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;border-top:1px dashed #edf1f8}
.kv:first-of-type{border-top:0}
.kv .k{color:#8993a5;font-weight:600}
.kv .v{color:#3b4658;font-weight:700;text-align:right}
.seg{display:flex;gap:4px;background:#f1f4fa;padding:4px;border-radius:12px;margin-bottom:10px}
.seg button{
  flex:1;appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:800;color:#6b7688;padding:8px 0;border-radius:9px;letter-spacing:-.2px;
}
.seg button.on{background:#fff;color:#121c33;box-shadow:0 1px 3px rgba(16,24,40,.12)}
input.txt{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  padding:10px 12px;border:1px solid var(--line);border-radius:11px;
  background:#f8fafd;margin-bottom:8px;outline:none;transition:.15s ease;
}
input.txt:focus{background:#fff;border-color:#b9ccff;box-shadow:0 0 0 3px rgba(47,107,255,.09)}
input.txt::placeholder{color:#aab4c4;font-size:13px}
.warn{
  font-size:11.5px;line-height:1.6;color:#8a5a00;background:#fff8e8;
  border:1px solid #f6e3b8;border-radius:10px;padding:8px 10px;margin:10px 0 0;letter-spacing:-.15px;
}
.api-status{font-size:12px;font-weight:700;margin-top:8px;letter-spacing:-.2px;min-height:17px}
.api-status.ok{color:#0f8f5c}
.api-status.err{color:#c0392b}
.api-status.wait{color:#7d8798}
.ver{font-size:11.5px;color:#a2acbd;text-align:center;padding:6px 0 10px;letter-spacing:-.2px}

/* ============================================================
   7. 토스트
   ============================================================ */
.toast{
  position:absolute;left:50%;bottom:calc(126px + var(--safe-b));transform:translate(-50%,10px);
  background:rgba(17,26,46,.95);color:#fff;
  font-size:12.5px;font-weight:700;letter-spacing:-.2px;
  padding:9px 15px;border-radius:999px;max-width:88%;text-align:center;
  opacity:0;pointer-events:none;transition:.24s ease;z-index:20;
  box-shadow:0 10px 24px -10px rgba(17,26,46,.8);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   8. 좁은 화면 보정
   ============================================================ */
@media (max-width:360px){
  h1{font-size:17.5px}
  .bubble{font-size:14px;padding:9px 11px}
  #sendBtn{padding:10px 12px;font-size:13px}
  .tab{font-size:12.5px}
}
@media (max-height:680px){
  h1{font-size:17px;margin:8px 0 2px}
  .top-status{margin-bottom:9px}
  .tab{padding:9px 0 12px}
}

</head>
<body>
<div class="app" id="app">

  <!-- ===== 헤더 ===== -->
  <header class="top">
    <div class="top-row">
      <div class="avatars" id="headerAvatars"></div>
      <span class="hbadge"><span class="dot"></span>AI 5개가 함께해요</span>
    </div>
    <h1>AI들이 일을 이어 가고 있어요</h1>
    <p class="top-status" id="headerStatus"></p>
    <nav class="tabs" role="tablist" aria-label="화면 전환">
      <button class="tab active" role="tab" aria-selected="true" data-tab="chat">대화·결정</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="team">멤버·AI</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="settings">설정</button>
    </nav>
  </header>

  <main>
    <!-- ===== 대화·결정 ===== -->
    <section class="panel" id="panel-chat" role="tabpanel">
      <div class="toolbar" id="toolbar">
        <button class="fchip on" data-filter="all">전체</button>
        <button class="fchip" data-filter="decision">결정 <span class="n" id="cntDecision"></span></button>
        <button class="fchip" data-filter="open">안 끝난 일 <span class="n" id="cntOpen"></span></button>
        <span class="spacer"></span>
        <button class="mini-link" data-act="sample">샘플</button>
        <button class="mini-link" data-act="jump">맨 아래로</button>
      </div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <button class="jump" id="jumpBtn" data-act="jump">새 메시지 ↓</button>

      <div class="composer">
        <div class="ch">AI에게 시킬 일</div>
        <div class="chips" id="targetChips"></div>
        <div class="inputrow" id="inputRow">
          <textarea id="input" rows="1" placeholder="모두에게 시킬 일을 적어 주세요"></textarea>
          <button id="sendBtn" data-act="send">지시 남기기</button>
        </div>
        <div class="hint">
          <span>Enter 전송 · Shift+Enter 줄바꿈</span>
          <span class="mode" id="modeHint"><i></i>예시 응답 모드</span>
        </div>
      </div>
    </section>

    <!-- ===== 멤버·AI ===== -->
    <section class="panel" id="panel-team" role="tabpanel" hidden>
      <div class="scroller" id="teamBody"></div>
    </section>

    <!-- ===== 설정 ===== -->
    <section class="panel" id="panel-settings" role="tabpanel" hidden>
      <div class="scroller" id="settingsBody"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     A. AI 5명 (역할 고정)
     ============================================================ */
  var AIS = [
    { id:'pickle', name:'피클', emoji:'🥒', color:'#0f9d63', soft:'#e4f7ee',
      role:'실행', tasks:['실행','전화','예약','쇼핑'],
      line:'전화·예약·쇼핑은 제가 직접 처리할게요.',
      apiRole:'실행 담당. 전화·예약·쇼핑·주문·발행 예약처럼 손이 필요한 일을 실제로 처리하고, 마지막에 할 일과 결정을 체크리스트로 정리한다.' },
    { id:'keyring', name:'키링', emoji:'🔑', color:'#b5751a', soft:'#fbf0da',
      role:'일정', tasks:['일정','정리','장기계획'],
      line:'일은 일정과 순서로 정리해 드릴게요.',
      apiRole:'일정·정리 담당. 일을 단계로 쪼개 날짜와 시간을 배분하고, 장기 계획과 우선순위를 정리한다.' },
    { id:'booey',  name:'부이', emoji:'🔎', color:'#2563eb', soft:'#e7efff',
      role:'조사', tasks:['자료조사','분석'],
      line:'자료와 근거를 확인해서 분석해 드릴게요.',
      apiRole:'자료조사·분석 담당. 근거와 자료를 확인해 분석하고, 확인되지 않은 수치는 추정이라고 밝힌다.' },
    { id:'cue',    name:'Cue',  emoji:'✨', color:'#7048e8', soft:'#e8defc',
      role:'초안', tasks:['아이디어','초안','비교'],
      line:'아이디어와 초안, 비교표까지 만들게요.',
      apiRole:'아이디어·초안·비교 담당. 아이디어를 내고 초안을 쓰며, 후보들을 같은 기준으로 나란히 비교표로 정리한다.' },
    { id:'muse',   name:'뮤즈', emoji:'🎨', color:'#d6336c', soft:'#fbdce9',
      role:'디자인', tasks:['디자인','취향','추천'],
      line:'취향에 맞는 걸 골라 드릴게요. 보이는 것도 같이요.',
      apiRole:'디자인·취향·추천 담당. 색·폰트·구도·톤앤매너를 제안하고, 사용자의 취향에 맞춰 후보 중 하나를 추천한다.' }
  ];

  var FLOW_ORDER = ['keyring','booey','cue','muse','pickle'];
  var CHIP_ORDER = ['pickle','keyring','cue','muse','booey'];

  function aiById(id){
    for (var i = 0; i < AIS.length; i++) if (AIS[i].id === id) return AIS[i];
    return null;
  }

  /* ============================================================
     B. 상태 · 저장
     ============================================================ */
  var STORE_KEY = 'ai-team-chat.v1';
  var storageOK = true;
  var seq = 0;

  var state = {
    version: 1,
    tab: 'chat',
    filter: 'all',
    target: 'all',
    messages: [],
    settings: { provider:'none', key:'', model:'' },
    savedAt: 0
  };

  var statusMap = {};

  function uid(){
    seq += 1;
    return 'm' + Date.now().toString(36) + seq.toString(36);
  }

  function msg(role, ai, text, ts, extra){
    var m = { id:uid(), role:role, ai: ai || null, text:text, ts: ts || Date.now(), done:false, decision:false };
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) m[k] = extra[k];
    return m;
  }

  function safeParse(raw){
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function loadState(){
    var raw = null;
    try { raw = window.localStorage.getItem(STORE_KEY); }
    catch (e) { storageOK = false; return null; }
    if (!raw) return null;
    var s = safeParse(raw);
    if (!s || !s.messages) return null;

    var out = {
      version: 1,
      tab: s.tab === 'team' || s.tab === 'settings' ? s.tab : 'chat',
      filter: s.filter === 'decision' || s.filter === 'open' ? s.filter : 'all',
      target: s.target || 'all',
      messages: [],
      settings: { provider:'none', key:'', model:'' },
      savedAt: s.savedAt || 0
    };
    if (s.settings){
      if (s.settings.provider === 'openai' || s.settings.provider === 'gemini') out.settings.provider = s.settings.provider;
      out.settings.key = typeof s.settings.key === 'string' ? s.settings.key : '';
      out.settings.model = typeof s.settings.model === 'string' ? s.settings.model : '';
    }
    s.messages.forEach(function (m) {
      if (!m || (m.role !== 'user' && m.role !== 'ai' && m.role !== 'system')) return;
      out.messages.push({
        id: m.id || uid(),
        role: m.role,
        ai: m.ai && aiById(m.ai) ? m.ai : null,
        text: String(m.text == null ? '' : m.text),
        ts: Number(m.ts) || Date.now(),
        done: !!m.done,
        decision: !!m.decision
      });
    });
    return out;
  }

  var saveTimer = null;
  function save(){
    state.savedAt = Date.now();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 200);
  }
  function flushSave(){
    saveTimer = null;
    if (!storageOK) return;
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        version: 1, tab: state.tab, filter: state.filter, target: state.target,
        messages: state.messages, settings: state.settings, savedAt: state.savedAt
      }));
    } catch (e) {
      storageOK = false;
    }
  }

  /* ============================================================
     C. 샘플 대화 (5명 협업 예시 · 설정에서 불러오기)
     ============================================================ */
  function sampleMessages(){
    var now = Date.now();
    var ago = function (min) { return now - min * 60000; };
    return [
      msg('user', null,
        '@모두에게 거실 겨울 이불 바꾸려고 해. 예산 15만원 안에서 고르고 싶어.',
        ago(16)),

      msg('ai', 'keyring',
        '일정부터 잡으면 이렇게 됩니다.\n\n· 오늘 — 후보 3개만 남기기 (예산 15만원, 사이즈 확인)\n· 내일 — 매장에서 질감 확인, 온라인 최저가 비교\n· 주말 — 주문, 도착하면 기존 이불 세탁·정리\n\n토요일 오전에 매장 볼 시간 한 시간만 비워 두세요. 그 안에 정하면 주문은 저녁에 끝납니다.',
        ago(15)),

      msg('ai', 'booey',
        '15만원대 거실 이불은 세 갈래로 나뉩니다.\n\n· 극세사 — 가장 따뜻하지만 정전기와 먼지가 붙어요\n· 모달·텐셀 — 부드럽고 관리가 편해요. 보온은 중간\n· 양모 혼방 — 보온·통기 균형이 좋고 가격이 위쪽\n\n낮에 햇빛이 드는 거실이면 모달·텐셀 쪽이 오래 편해요. 가격은 매장마다 차이가 커서 확인되는 값만 표로 정리해 둘게요.',

  var WEEKDAYS = ['일','월','화','수','목','금','토'];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }

  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  function dayKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function dayLabel(ts){
    var d = new Date(ts);
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WEEKDAYS[d.getDay()] + '요일';
  }

  function timeLabel(ts){
    var d = new Date(ts);
    var h = d.getHours();
    var ap = h < 12 ? '오전' : '오후';
    var hh = h % 12;
    if (hh === 0) hh = 12;
    return ap + ' ' + hh + ':' + pad2(d.getMinutes());
  }

  function stamp(){
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }

  function wait(ms){
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function pick(arr, seed){
    var h = 0, s = String(seed || 'x');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 99991;
    return arr[h % arr.length];
  }

  function firstLine(t){
    var s = String(t || '').split('\n')[0];
    if (s.length > 62) s = s.slice(0, 62) + '…';
    return s;
  }

  function mentionColor(name){
    for (var i = 0; i < AIS.length; i++) {
      if (AIS[i].name.toLowerCase() === String(name).toLowerCase()) return AIS[i].color;
    }
    return '#2f6bff';
  }

  function formatText(text){
    var s = esc(text);
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/@(피클|키링|부이|Cue|뮤즈)/gi, function (m, n) {
      return '<span class="mention" style="--mc:' + mentionColor(n) + '">@' + n + '</span>';
    });
    return s;
  }

     E. 응답 시뮬레이션

  function cleanBrief(text){
    return String(text)
      .replace(/@(피클|키링|부이|Cue|뮤즈)/gi, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function topicOf(brief){
    var t = String(brief).split(/[.?!]\s/)[0] || String(brief);
    var strip = /(해\s?주세요|해줘|해\s?줘|주세요|부탁해|부탁드려요|골라줘|알려줘|정리해줘|만들어줘|뽑아줘|찾아줘|줘|골라|알려|정리해|만들어|뽑아|찾아|비교해|계획해|짜|세워|보여|좀)\s*$/g;
    t = t.replace(strip, '').replace(strip, '')
      .replace(/\s*\d+\s*개(만)?\s*$/g, '')
      .replace(/[.!?~,]+\s*$/g, '')
      .trim();
    if (!t) t = '이번 일';
    if (t.length > 26) t = t.slice(0, 26).replace(/[,\s]+$/, '') + '…';
    return t;
  }

  function isAck(t){
    return /^(웅|응|어|네|넵|예|yes|ok|okay|좋아|좋아요|좋습니다|그래|그렇게|그렇게\s?해|오케이|ㅇㅋ|콜|고고|가자|진행|시작|확인|1|2|3)[\s.!~]*$/i.test(String(t).trim());

    if (aiId === 'keyring') return replyKeyring(c);
    if (aiId === 'booey') return replyBooey(c);

  /* ---- 주제에 맞는 AI 고르기 (모두에게 → 2~3명) ---- */
  var KEYWORDS = {
    pickle: ['예약','전화','문의','주문','쇼핑','구매','결제','배송','취소','반품','걸어','보내','사야','살까','구해','준비'],
    keyring: ['일정','계획','정리','언제','마감','주말','이번 주','다음 주','월요일','화요일','수요일','목요일','금요일','토요일','순서','할 일','장기','매일','꾸준'],
    booey: ['자료','조사','분석','통계','시장','근거','왜','원인','데이터','트렌드','현황','사실','검증'],
    cue: ['제목','문구','아이디어','초안','비교','후킹','카피','글','쓰','작성','문장','표로','비교표'],
    muse: ['디자인','썸네일','색','폰트','톤','취향','추천','어울','분위기','스타일','고르','골라','어떤','뭐가','예쁜','이쁜','느낌','깔끔']
  };

  function relatedAIs(text){
    var t = String(text);
    var scores = [];
    AIS.forEach(function (a) {
      var s = 0;
      (KEYWORDS[a.id] || []).forEach(function (k) {
        if (t.indexOf(k) >= 0) s += 1;
      });
      scores.push({ id:a.id, s:s });
    });
    scores.sort(function (a, b) { return b.s - a.s; });

    var picked = [];
    scores.forEach(function (x) {
      if (picked.length < 3 && x.s > 0) picked.push(x.id);
    });
    if (picked.length === 0) picked = ['keyring', 'pickle'];
    if (picked.length === 1) {
      picked.push(picked[0] === 'pickle' ? 'keyring' : 'pickle');
    }
    return picked;
  }

  function buildFlow(targets, text, allFlag){
    var brief = cleanBrief(text);
    var ack = isAck(brief);
    var thanks = isThanks(brief);
    var ids = allFlag ? relatedAIs(brief) : targets.slice();

    if ((ack || thanks) && ids.length > 1) {
      ids = [ids.indexOf('pickle') >= 0 ? 'pickle' : ids[0]];
    }
    ids.sort(function (a, b) { return FLOW_ORDER.indexOf(a) - FLOW_ORDER.indexOf(b); });

    var ctx = { brief:brief, topic:topicOf(brief), ack:ack, thanks:thanks, said:{} };
    var steps = [];
    ids.forEach(function (id) {
      var r = replyFor(id, ctx);
      ctx.said[id] = r.text;
      steps.push({
        ai: id,
        text: r.text,
        decision: !!r.decision,
        delay: 600 + Math.round(Math.random() * 1400)
      });
    });
    return steps;
  }

    if (found.length) return found;
    if (chip && chip !== 'all') return [chip];
    return null;
  }

  function httpError(res, data){
    var d = '';
    try {
      if (data && data.error && data.error.message) d = String(data.error.message).slice(0, 130);
      else if (data && data.message) d = String(data.message).slice(0, 130);
    } catch (e) { d = ''; }
    return 'HTTP ' + res.status + (d ? ' · ' + d : '');
  }

  async function callApi(aiId){
    var s = state.settings;
    var h = historyFor(aiId);

    if (s.provider === 'openai') {
      var r1 = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + s.key },
        body: JSON.stringify({
          model: modelName(),
          temperature: 0.85,
          max_tokens: 700,
          messages: [{ role:'system', content:h.sys }].concat(h.msgs)
        })
      });
      var d1 = null;
      try { d1 = await r1.json(); } catch (e) { d1 = null; }
      if (!r1.ok) throw new Error(httpError(r1, d1));
      if (!d1 || !d1.choices || !d1.choices[0] || !d1.choices[0].message) throw new Error('응답 형식이 예상과 달라요');
      var out1 = String(d1.choices[0].message.content || '').trim();
      if (!out1) throw new Error('빈 응답');
      return out1;
    }

    var contents = h.msgs.map(function (m) {
      return { role: m.role === 'user' ? 'user' : 'model', parts:[{ text:m.content }] };
    });
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
      encodeURIComponent(modelName()) + ':generateContent?key=' + encodeURIComponent(s.key);
    var r2 = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        system_instruction:{ parts:[{ text:h.sys }] },
        contents: contents,
        generationConfig:{ temperature:0.9, maxOutputTokens:800 }
      })
    });
    var d2 = null;
    try { d2 = await r2.json(); } catch (e) { d2 = null; }
    if (!r2.ok) throw new Error(httpError(r2, d2));
    var cand = d2 && d2.candidates && d2.candidates[0];
    var parts = cand && cand.content && cand.content.parts;
    if (!parts || !parts.length) throw new Error('응답이 비어 있어요 (안전 필터일 수 있어요)');
    var out2 = parts.map(function (p) { return p.text || ''; }).join('').trim();
    if (!out2) throw new Error('빈 응답');
    return out2;
  }

    var t = el.input;
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 108) + 'px';
  }

  async function send(){
    if (busy) return;
    var text = el.input.value.trim();
    if (!text) { el.input.focus(); return; }

    pushMessage(msg('user', null, text));
    if (state.filter !== 'all') { state.filter = 'all'; renderFilters(); }
    el.input.value = '';
    autoGrow();
    updateSendState();
    renderThread({ force:true });
    scrollBottom(true);

    var explicit = resolveTargets(text, state.target);
    var allFlag = !explicit;
    var targets = allFlag ? relatedAIs(cleanBrief(text)) : explicit;
    var flow = buildFlow(targets, text, allFlag);

    busy = true;
    updateSendState();

    try {
      for (var i = 0; i < flow.length; i++) {
        var step = flow[i];
        setStatus(step.ai, 'working');
        showTyping(step.ai);

        if (apiReady()) {
          try {
            var reply = await callApi(step.ai);
            hideTyping();
            pushMessage(msg('ai', step.ai, reply));
          } catch (err) {
            hideTyping();
            pushSystem('⚠️ ' + aiById(step.ai).name + '의 실제 응답을 받지 못해 예시 응답으로 이어 갑니다. (' + shortErr(err) + ')');
            pushMessage(msg('ai', step.ai, step.text, Date.now(), { decision:step.decision }));
          }
        } else {
          await wait(step.delay);
          hideTyping();
          pushMessage(msg('ai', step.ai, step.text, Date.now(), { decision:step.decision }));
        }

        setStatus(step.ai, 'idle');
        renderThread();
        scrollBottom(true);
      }
    } finally {
      busy = false;
      hideTyping();
      updateSendState();
      if (state.tab === 'team') renderTeam();
    }
  }

  function toggleDone(id){
    var found = null;
    state.messages.forEach(function (m) { if (m.id === id) found = m; });
    if (!found) return;
    found.done = !found.done;
    save();
    renderThread();
    renderHeader();
    if (state.tab === 'team') renderTeam();
    toast(found.done ? '완료로 표시했어요' : '완료를 풀었어요');
  }

  function reloadSample(){
    if (state.messages.length && !window.confirm('샘플 대화로 바꿀까요? 지금 대화는 지워져요.')) return;
    state.messages = sampleMessages();
    state.filter = 'all';
    save();
    renderFilters();
    renderThread({ force:true });
    renderHeader();
    toast('샘플 대화를 불러왔어요');
  }

  function clearAll(){
    if (!window.confirm('대화를 전부 지울까요? 되돌릴 수 없어요.')) return;
    state.messages = [];
    state.filter = 'all';
    save();
    renderFilters();
    renderThread({ force:true });
    renderHeader();
    toast('대화를 비웠어요');
  }

  function exportJson(){
    var payload = {
      app: 'AI 5종 협업 채팅방',
      version: 1,
      exportedAt: new Date().toISOString(),
      messages: state.messages.map(function (m) {
        return {
          role: m.role,
          ai: m.ai || null,
          text: m.text,
          time: new Date(m.ts).toISOString(),
          done: !!m.done,
          decision: !!m.decision
        };
      })
    };
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'ai-team-chat-' + stamp() + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 800);
      toast('JSON으로 내보냈어요 (API 키는 빠짐)');
    } catch (e) {
      toast('내보내기에 실패했어요: ' + shortErr(e));
    }
  }

  function syncSettingsInputs(){
    var k = $('apiKey'), m = $('apiModel');
    if (k) state.settings.key = k.value.trim();
    if (m) state.settings.model = m.value.trim();
  }

  function setApiStatus(text, cls){
    if (state.tab !== 'settings') return;
    var s = $('apiStatus');
    if (!s) return;
    s.className = 'api-status ' + (cls || 'wait');
    s.textContent = text || '';
  }

  async function testApi(){
    syncSettingsInputs();
    save();
    var s = state.settings;
    if (s.provider === 'none') { setApiStatus('제공자를 먼저 골라 주세요.', 'err'); return; }
    if (s.key.length < 12) { setApiStatus('키를 넣어 주세요.', 'err'); return; }
    setApiStatus('연결 확인 중…', 'wait');
    try {
      var res, data;
      if (s.provider === 'openai') {
        res = await fetch('https://api.openai.com/v1/models', { headers:{ 'Authorization':'Bearer ' + s.key } });
      } else {
        res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(s.key));
      }
      try { data = await res.json(); } catch (e) { data = null; }
      if (!res.ok) throw new Error(httpError(res, data));
      var list = (s.provider === 'openai' ? (data && data.data) : (data && data.models)) || [];
      var want = modelName();
      var has = false;
      list.forEach(function (m) {
        var id = m && (m.id || m.name) ? String(m.id || m.name) : '';
        if (id.indexOf(want) >= 0) has = true;
      });
      setApiStatus('연결됐어요 · ' + (has ? want + ' 사용 가능' : want + ' 확인 필요 (모델 이름을 확인해 주세요)'), 'ok');
    } catch (err) {
      setApiStatus('연결 실패: ' + shortErr(err) + ' — 키·네트워크를 확인해 주세요.', 'err');
    }
  }

  /* ============================================================
     I. 이벤트
     ============================================================ */
  function onDocClick(e){
    var t = e.target;
    if (!t || typeof t.closest !== 'function') return;

    var tabBtn = t.closest('[data-tab]');
    if (tabBtn) {
      state.tab = tabBtn.getAttribute('data-tab');
      save();
      renderTabs();
      return;
    }

    var fchip = t.closest('[data-filter]');
    if (fchip) {
      state.filter = fchip.getAttribute('data-filter');
      renderFilters();
      renderThread({ force:true });
      save();
      return;
    }

    var chip = t.closest('[data-target]');
    if (chip) {
      state.target = chip.getAttribute('data-target');
      renderChips();
      save();
      if (state.target !== 'all') {
        var ca = aiById(state.target);
        el.input.placeholder = (ca ? ca.name : '') + '에게 시킬 일을 적어 주세요';
      } else {
        el.input.placeholder = '모두에게 시킬 일을 적어 주세요';
      }
      return;
    }

    var prov = t.closest('[data-provider]');
    if (prov) {
      syncSettingsInputs();
      state.settings.provider = prov.getAttribute('data-provider');
      save();
      renderSettings();
      renderModeHint();
      return;
    }

    var sendBtn = t.closest('[data-send]');
    if (sendBtn) {
      el.input.value = sendBtn.getAttribute('data-send');
      autoGrow();
      updateSendState();
      send();
      return;
    }

    var fill = t.closest('[data-fill]');
    if (fill) {
      el.input.value = fill.getAttribute('data-fill');
      autoGrow();
      updateSendState();
      el.input.focus();
      return;
    }

    var act = t.closest('[data-act]');
    if (act) {
      var a2 = act.getAttribute('data-act');
      if (a2 === 'send') { send(); return; }
      if (a2 === 'done') { toggleDone(act.getAttribute('data-id')); return; }
      if (a2 === 'sample') { reloadSample(); return; }
      if (a2 === 'clear') { clearAll(); return; }
      if (a2 === 'export') { exportJson(); return; }
      if (a2 === 'jump') { scrollBottom(true); return; }
      if (a2 === 'saveApi') { syncSettingsInputs(); save(); renderModeHint(); toast('API 설정을 저장했어요'); return; }
      if (a2 === 'testApi') { testApi(); return; }
      if (a2 === 'clearApi') {
        syncSettingsInputs();
        state.settings.key = '';
        state.settings.provider = 'none';
        save();
        renderSettings();
        renderModeHint();
        toast('키를 지웠어요');
        return;
      }
      if (a2 === 'mention') {
        var id = act.getAttribute('data-ai');
        var ai = aiById(id);
        state.target = id;
        state.tab = 'chat';
        renderChips();
        renderTabs();
        var tag = '@' + (ai ? ai.name : '') + ' ';
        if (!el.input.value || el.input.value.indexOf(tag) !== 0) el.input.value = tag;
        el.input.placeholder = (ai ? ai.name : '') + '에게 시킬 일을 적어 주세요';
        autoGrow();
        updateSendState();
        setTimeout(function () { el.input.focus(); }, 80);
        save();
        return;
      }
      return;
    }
  }

  function init(){
    el.app = $('app');
    el.headerAvatars = $('headerAvatars');
    el.headerStatus = $('headerStatus');
    el.thread = $('thread');
    el.targetChips = $('targetChips');
    el.input = $('input');
    el.inputRow = $('inputRow');
    el.sendBtn = $('sendBtn');
    el.teamBody = $('teamBody');
    el.settingsBody = $('settingsBody');
    el.toast = $('toast');
    el.jumpBtn = $('jumpBtn');
    el.cntDecision = $('cntDecision');
    el.cntOpen = $('cntOpen');
    el.modeHint = $('modeHint');
    el.composer = document.querySelector('.composer');

    var loaded = loadState();
    if (loaded) {
      state = loaded;
    } else {
      state.messages = [];      /* 첫 화면은 빈 상태 + 예시 질문 3개 */
      state.savedAt = Date.now();
      flushSave();
    }
    AIS.forEach(function (a) { statusMap[a.id] = 'idle'; });

    renderHeader();
    renderChips();
    renderFilters();
    renderTabs();
    renderThread({ force:true });
    renderTeam();
    renderSettings();
    renderModeHint();
    updateSendState();
    layoutOverlays();

    window.addEventListener('resize', layoutOverlays);
    document.addEventListener('click', onDocClick);

    el.input.addEventListener('input', function () { autoGrow(); updateSendState(); });
    el.input.addEventListener('focus', function () { el.inputRow.classList.add('focus'); });
    el.input.addEventListener('blur', function () { el.inputRow.classList.remove('focus'); });
    el.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    el.settingsBody.addEventListener('input', function (e) {
      if (e.target && (e.target.id === 'apiKey' || e.target.id === 'apiModel')) {
        syncSettingsInputs();
        save();
        renderModeHint();
      }
    });

    el.thread.addEventListener('scroll', function () {
      var t = el.thread;
      var far = t.scrollHeight - t.scrollTop - t.clientHeight > 220;
      el.jumpBtn.classList.toggle('on', far);
    });

    window.addEventListener('beforeunload', flushSave);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
